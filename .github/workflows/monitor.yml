# Continuous monitoring in the cloud -- runs on GitHub's servers, so Teams
# alerts keep going out even when the laptop is off.
#
# Every 5 minutes this does one run_fast_checks.py pass. When a site goes
# DOWN, a card listing ONLY the newly-down site(s) is posted to
# TEAMS_WEBHOOK_URL. A site already sent in an earlier card is not sent
# again while it stays down; once it recovers, a later outage is sent again.
# monitoring.db + .digest_state.json are carried between runs via the Actions
# cache so that "already sent" list survives. (daily-report.yml re-lists
# still-down sites once a day.)
#
# Nothing is sent until the webhook is connected: repo -> Settings -> Secrets
# and variables -> Actions -> New repository secret:
#   TEAMS_WEBHOOK_URL = <Teams Workflows link for the immediate down alerts>
#   (the 09:30 daily report uses its own secret, TEAMS_DAILY_WEBHOOK_URL)
#
# The repo is public, so Actions minutes are free and unlimited; 5 minutes is
# the shortest schedule GitHub allows. GitHub may start scheduled runs late
# under load (often 5-15 min).

name: Website monitor

on:
  # Scheduled runs are OFF: the Kleza server runs run_fast_checks.py whenever
  # it is on (setup_scheduled_tasks.ps1). Re-enable by uncommenting these two
  # lines (and don't run both, or each posts its own cards).
  # schedule:
  #   - cron: "*/5 * * * *"    # every 5 minutes (GitHub minimum)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

concurrency:
  group: website-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      # Reuse the installed packages between runs instead of reinstalling.
      - name: Restore virtualenv
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      # Previous run's check history + "already notified" list.
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: |
            monitoring.db
            .digest_state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Run checks (posts to Teams if a site went down)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PYTHONIOENCODING: utf-8
        run: .venv/bin/python run_fast_checks.py

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            monitoring.db
            .digest_state.json
          key: monitor-state-${{ github.run_id }}
